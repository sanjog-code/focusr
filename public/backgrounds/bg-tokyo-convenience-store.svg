<!-- Focusr Spatial Wallpaper [Midnight Konbini] (Seed: 111) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="hearthGlow_111" cx="50%" cy="65%" r="65%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.75"/>
      <stop offset="45%" stop-color="#0369a1" stop-opacity="0.32"/>
      <stop offset="85%" stop-color="#06101a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#040201"/>
    </radialGradient>
    <filter id="softGlow_111">
      <feGaussianBlur stdDeviation="50"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#hearthGlow_111)"/>

  <!-- Architectural Window / Interior Panes -->
  <g stroke="rgba(255,255,255,0.08)" stroke-width="8" fill="none">
    <rect x="240" y="140" width="600" height="720" rx="20"/>
    <line x1="540" y1="140" x2="540" y2="860"/>
    <line x1="240" y1="500" x2="840" y2="500"/>
  </g>

  <!-- Ambient Bokeh Spheres -->
  <circle cx="400" cy="300" r="110" fill="#0284c7" opacity="0.25" filter="url(#softGlow_111)"/>
  <circle cx="700" cy="420" r="85" fill="#0284c7" opacity="0.3" filter="url(#softGlow_111)"/>
  <circle cx="520" cy="680" r="140" fill="#0284c7" opacity="0.18" filter="url(#softGlow_111)"/>
  <circle cx="1300" cy="520" r="190" fill="#0284c7" opacity="0.22" filter="url(#softGlow_111)"/>
  <circle cx="1550" cy="360" r="130" fill="#0284c7" opacity="0.28" filter="url(#softGlow_111)"/>
</svg>