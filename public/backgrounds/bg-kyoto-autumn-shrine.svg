<!-- Focusr Spatial Wallpaper [Tofukuji Maple Cloister] (Seed: 151) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="sky_151" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#040b10"/>
      <stop offset="50%" stop-color="#120606"/>
      <stop offset="85%" stop-color="#0f261c"/>
      <stop offset="100%" stop-color="#020906"/>
    </linearGradient>
    <radialGradient id="sun_151" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#f97316" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <filter id="mist_151">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#sky_151)"/>

  <!-- Glowing Sun/Moon Disk -->
  <circle cx="780" cy="500" r="180" fill="url(#sun_151)" opacity="0.75"/>

  <!-- Distant Ridge -->
  <path d="M0,640 Q400,561 960,563 T1920,620 L1920,1080 L0,1080 Z" fill="#0a1a14" opacity="0.7"/>

  <!-- Midground Ridge -->
  <path d="M0,740 Q550,617 1100,719 T1920,720 L1920,1080 L0,1080 Z" fill="#06120d" opacity="0.85"/>

  <!-- Atmospheric Valley Mist Layer -->
  <rect x="0" y="660" width="1920" height="140" fill="#ef4444" opacity="0.12" filter="url(#mist_151)"/>

  <!-- Foreground Mountains & Lake Reflection -->
  <path d="M0,860 Q480,797 1020,795 T1920,850 L1920,1080 L0,1080 Z" fill="#020705"/>
</svg>