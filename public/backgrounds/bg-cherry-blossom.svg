<!-- Focusr Spatial Wallpaper [Sakura Night Garden] (Seed: 14) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="sky_14" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#040b10"/>
      <stop offset="50%" stop-color="#1a0a14"/>
      <stop offset="85%" stop-color="#0f261c"/>
      <stop offset="100%" stop-color="#020906"/>
    </linearGradient>
    <radialGradient id="sun_14" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#db2777" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <filter id="mist_14">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#sky_14)"/>

  <!-- Glowing Sun/Moon Disk -->
  <circle cx="820" cy="460" r="180" fill="url(#sun_14)" opacity="0.75"/>

  <!-- Distant Ridge -->
  <path d="M0,640 Q400,554 960,522 T1920,620 L1920,1080 L0,1080 Z" fill="#0a1a14" opacity="0.7"/>

  <!-- Midground Ridge -->
  <path d="M0,740 Q550,578 1100,686 T1920,720 L1920,1080 L0,1080 Z" fill="#06120d" opacity="0.85"/>

  <!-- Atmospheric Valley Mist Layer -->
  <rect x="0" y="660" width="1920" height="140" fill="#f472b6" opacity="0.12" filter="url(#mist_14)"/>

  <!-- Foreground Mountains & Lake Reflection -->
  <path d="M0,860 Q480,818 1020,800 T1920,850 L1920,1080 L0,1080 Z" fill="#020705"/>
</svg>