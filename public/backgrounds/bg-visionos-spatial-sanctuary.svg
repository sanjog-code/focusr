<!-- Focusr Spatial Wallpaper [VisionOS Spatial Glass] (Seed: 143) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="minimalGrad_143" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#121828"/>
      <stop offset="60%" stop-color="#080c16"/>
      <stop offset="100%" stop-color="#030508"/>
    </radialGradient>
    <linearGradient id="prismEdge_143" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glassGlow_143">
      <feGaussianBlur stdDeviation="30" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#minimalGrad_143)"/>

  <!-- VisionOS Isometric Floating Glass Slabs -->
  <g transform="translate(960, 540) rotate(8)">
    <!-- Slab 1 -->
    <polygon points="-380,-120 180,-280 380,80 -180,240" fill="rgba(255,255,255,0.03)" stroke="url(#prismEdge_143)" stroke-width="2.5" filter="url(#glassGlow_143)"/>
    <!-- Slab 2 -->
    <polygon points="-280,-20 280,-180 480,180 -80,340" fill="rgba(255,255,255,0.02)" stroke="url(#prismEdge_143)" stroke-width="1.8"/>
    <!-- Specular Flare Core -->
    <circle cx="0" cy="0" r="160" fill="#38bdf8" opacity="0.18" filter="url(#glassGlow_143)"/>
  </g>
</svg>