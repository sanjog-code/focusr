      <stop offset="50%" stop-color="#be123c" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0" />
    </linearGradient>
    <filter id="glow_20">
      <feGaussianBlur stdDeviation="40" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#space_20)"/>
  <rect width="100%" height="100%" fill="url(#nebulaA_20)" style="mix-blend-mode: screen;"/>
  <rect width="100%" height="100%" fill="url(#nebulaB_20)" style="mix-blend-mode: screen;"/>

