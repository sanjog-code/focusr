      <stop offset="0%" stop-color="#0b1022" />
      <stop offset="65%" stop-color="#1a060a" />
      <stop offset="100%" stop-color="#020308" />
    </radialGradient>
    <radialGradient id="nebulaA_20" cx="55%" cy="60%" r="70%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.48" />
      <stop offset="45%" stop-color="#be123c" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
