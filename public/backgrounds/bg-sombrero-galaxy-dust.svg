<!-- Focusr Spatial Wallpaper [Sombrero Galaxy Rim] (Seed: 80) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="space_80" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#0b1022" />
      <stop offset="65%" stop-color="#080a10" />
      <stop offset="100%" stop-color="#020308" />
    </radialGradient>
    <radialGradient id="nebulaA_80" cx="45%" cy="65%" r="70%">
      <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0.48" />
      <stop offset="45%" stop-color="#94a3b8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="nebulaB_80" cx="45%" cy="55%" r="60%">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.40" />
      <stop offset="50%" stop-color="#cbd5e1" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ring_80" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#94a3b8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0" />
    </linearGradient>
    <filter id="glow_80">
      <feGaussianBlur stdDeviation="40" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#space_80)"/>
  <rect width="100%" height="100%" fill="url(#nebulaA_80)" style="mix-blend-mode: screen;"/>
  <rect width="100%" height="100%" fill="url(#nebulaB_80)" style="mix-blend-mode: screen;"/>

  <!-- Celestial Singularity & Rings -->
  <g transform="translate(1000, 500)">
    <ellipse rx="420" ry="120" fill="none" stroke="url(#ring_80)" stroke-width="22" opacity="0.68" transform="rotate(15)" filter="url(#glow_80)"/>
    <ellipse rx="540" ry="155" fill="none" stroke="url(#ring_80)" stroke-width="5" opacity="0.45" transform="rotate(15)"/>
    <circle r="140" fill="#020308"/>
    <circle r="140" fill="none" stroke="#cbd5e1" stroke-width="7" opacity="0.85" filter="url(#glow_80)"/>
    <circle r="138" fill="url(#nebulaA_80)" opacity="0.8"/>
  </g>

